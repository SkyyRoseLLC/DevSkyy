sandbox_mode = "danger-full-access"
model_reasoning_summary = "detailed"

model_verbosity = "high"
[features]
code_mode = true
code_mode_host = true
code_mode_only = true
deferred_executor = true
deferred_tool_world_state = true
executor_capability_discovery = true
skill_search = true

[mcp_servers.gemini-api-docs-mcp]
type = "http"
url = "https://gemini-api-docs-mcp.dev"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_AUTOCOMPACT_PCT_OVERRIDE = "60"
CLAUDE_CODE_SUBAGENT_MODEL = "fable"
CONTEXT7_PREFETCH_DISABLE = "1"
CANON_PREFETCH_DISABLE = "1"
PROMPT_ENG_NUDGE_DISABLE = "1"
ENABLE_TOOL_SEARCH = "true"

# Runtime and environment URLs (frequently used by commands and scripts).
SKYYROSE_PROD_FRONTEND_URL = "https://app.devskyy.app"
SKYYROSE_PROD_DASHBOARD_URL = "https://app.devskyy.app"
SKYYROSE_PROD_API_URL = "https://api.devskyy.app"
SKYYROSE_PROD_API_BASE_URL = "https://api.devskyy.app"
SKYYROSE_PROD_API_V1_URL = "https://api.devskyy.app/api/v1"
SKYYROSE_PROD_WORDPRESS_URL = "https://skyyrose.com"
SKYYROSE_PROD_WORDPRESS_SITE = "https://skyyrose.co"
SKYYROSE_WP_STAGING_PUBLIC_URL = "https://staging.skyyrose.com"
SKYYROSE_STAGING_FRONTEND_URL = "https://staging.devskyy.app"
SKYYROSE_STAGING_DASHBOARD_URL = "https://staging.devskyy.app"
SKYYROSE_STAGING_API_URL = "https://staging-api.devskyy.app"
SKYYROSE_STAGING_API_BASE_URL = "https://staging-api.devskyy.app"
SKYYROSE_STAGING_API_V1_URL = "https://staging-api.devskyy.app/api/v1"
SKYYROSE_STAGING_WORDPRESS_URL = "https://staging-7e48-skyyrose.wpcomstaging.com"
SKYYROSE_STAGING_WORDPRESS_SITE = "https://staging.skyyrose.com"
SKYYROSE_WPCLI_HOST = "skyyrose.wordpress.com"
SKYYROSE_STAGING_WPCLI_HOST = "staging-7e48-skyyrose.wordpress.com"

# Imagery / 3D pipeline endpoints and known provider URLs.
SKYYROSE_TRIPO_API_BASE_URL = "https://api.tripo3d.ai/v2"
SKYYROSE_TRIPO_API_OPENAPI_URL = "https://api.tripo3d.ai/v2/openapi"
SKYYROSE_TRIPO_DASHBOARD_URL = "https://www.tripo3d.ai/dashboard"
SKYYROSE_TRIPO_DOCS_URL = "https://platform.tripo3d.ai/docs/api"
SKYYROSE_MESHY_API_URL = "https://api.meshy.ai"

# Higgsfield / multimodel workflow metadata (non-secret capabilities map).
SKYYROSE_HIGGSFIELD_WEB_URL = "https://higgsfield.ai"
SKYYROSE_HIGGSFIELD_API_URL = "https://api.higgsfield.ai"
SKYYROSE_MULTIMODEL_PIPELINE = "llm-round-table"
SKYYROSE_MULTIMODEL_CAPABILITIES = "text-to-text,text-to-image,image-to-image,vision-routing,3d-generation"
SKYYROSE_MULTIMODEL_PROVIDERS = "OPENAI,ANTHROPIC,GOOGLE_AI,GROQ,MISTRAL,COHERE"

# Backward-compatible aliases used by scripts.
