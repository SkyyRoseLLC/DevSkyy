<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Collection scene pending</title>
  <desc id="desc">Neutral placeholder indicating that approved collection artwork is not yet available.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#1b1715"/>
      <stop offset="1" stop-color="#0a0909"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0" stop-color="#c79676" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c79676" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M160 720h1280" stroke="#c79676" stroke-opacity="0.35"/>
  <text x="800" y="430" fill="#e8ddd5" font-family="Georgia, serif" font-size="44" text-anchor="middle" letter-spacing="8">SCENE PENDING</text>
  <text x="800" y="485" fill="#b8a69b" font-family="Georgia, serif" font-size="20" text-anchor="middle" letter-spacing="4">APPROVED ARTWORK REQUIRED</text>
</svg>
