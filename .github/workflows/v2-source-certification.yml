name: V2 source certification
on:
  pull_request:
    paths:
      - 'wordpress-theme/skyyrose-flagship-2/**'
      - 'wordpress-theme/skyyrose-flagship/data/**'
      - 'wordpress-theme/skyyrose-flagship/assets/images/products/**'
      - 'tools/v2-source-certification/**'
      - 'tools/v2-runtime/**'
      - '.github/workflows/v2-source-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.12'
      - name: Install declared verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli jq ripgrep imagemagick
          npm install --global npm@10.9.8
          python -m pip install -r tools/v2-source-certification/requirements.txt
          npm --prefix wordpress-theme/skyyrose-flagship-2 ci --ignore-scripts --no-audit --no-fund
      - name: Negative integrity tests
        run: python -m unittest discover -s tools/v2-source-certification -p 'test_*.py'
      - name: Prepare hash-pinned native gallery fixture
        run: |
          python tools/v2-source-certification/prepare-native-fixture.py "$RUNNER_TEMP/v2-native-wordpress"
          echo "V2_WP_FIXTURE=$RUNNER_TEMP/v2-native-wordpress" >> "$GITHUB_ENV"
      - name: Build, verify, package and compare
        run: |
          npm --prefix wordpress-theme/skyyrose-flagship-2 run package:theme
          git diff --exit-code
          cp wordpress-theme/skyyrose-flagship-2/dist/skyyrose-flagship-2.zip /tmp/v2-first.zip
          npm --prefix wordpress-theme/skyyrose-flagship-2 run package:theme
          cmp /tmp/v2-first.zip wordpress-theme/skyyrose-flagship-2/dist/skyyrose-flagship-2.zip
          git diff --exit-code
